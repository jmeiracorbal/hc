name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          go build \
            -ldflags="-X main.version=${{ github.ref_name }}" \
            -o hc-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/hc/

      - name: Checksum
        run: |
          shasum -a 256 hc-${{ matrix.goos }}-${{ matrix.goarch }} \
            > hc-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            hc-${{ matrix.goos }}-${{ matrix.goarch }}
            hc-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
